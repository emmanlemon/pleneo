services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planeo
      POSTGRES_PASSWORD: planeo
      POSTGRES_DB: planeo
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planeo -d planeo']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgres://planeo:planeo@postgres:5432/planeo
      HOST: 0.0.0.0
    ports:
      - '4100:4100'
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node src/infrastructure/database/migrate.js && node src/server.js"

volumes:
  pgdata:
